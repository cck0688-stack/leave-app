<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="근무 상신"><meta name="theme-color" content="#1f5fbf">
<title>근무 상신</title>
<style>
  :root{
    --bg:#f4f1ea; --card:#fff; --ink:#1d1d1b; --sub:#5c5a55;
    --main:#1f5fbf; --main-ink:#fff; --line:#cfc9bb; --ok:#1c7a3f; --warn:#b3261e;
    --kakao:#fee500;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:22px;line-height:1.4;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
  h1{font-size:30px;margin:8px 0 4px}
  .hint{color:var(--sub);font-size:18px;margin:0 0 12px}
  .card{background:var(--card);border-radius:18px;padding:18px;margin:14px 0;
    box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .step{display:flex;align-items:center;gap:10px;font-weight:700;font-size:24px;margin-bottom:12px}
  .num{background:var(--main);color:#fff;border-radius:50%;width:36px;height:36px;
    display:inline-flex;align-items:center;justify-content:center;font-size:20px;flex:none}
  button{font:inherit;color:inherit;cursor:pointer}
  .opt{background:#fff;border:3px solid var(--line);border-radius:14px;min-height:64px;
    padding:10px 8px;font-weight:700;font-size:24px;width:100%}
  .opt[aria-pressed="true"]{background:var(--main);color:#fff;border-color:var(--main)}
  .grid{display:grid;gap:10px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  input[type=text],input[type=date]{font:inherit;font-size:24px;width:100%;padding:12px;
    border:3px solid var(--line);border-radius:12px;background:#fff}
  .lbl{font-size:18px;color:var(--sub);margin:12px 0 6px;font-weight:700}
  .timebox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .timebtn{border:3px solid var(--line);background:#fff;border-radius:14px;padding:8px;text-align:center}
  .timebtn small{display:block;font-size:17px;color:var(--sub);font-weight:700}
  .timebtn b{font-size:40px;letter-spacing:1px}
  .timebtn.active{border-color:var(--main);background:#e8f0fc}
  .timebtn.fixed{background:#eee;color:var(--sub)}
  .pick{margin-top:14px;padding-top:12px;border-top:2px dashed var(--line)}
  .pick .opt{min-height:56px;font-size:26px}
  .pick .opt:disabled{opacity:.25}
  .summary{font-size:24px;line-height:1.7}
  .summary dt{color:var(--sub);font-size:18px;font-weight:700;margin-top:6px}
  .summary dd{margin:0;font-weight:700}
  .err{color:var(--warn);font-weight:700;font-size:20px;min-height:28px;margin:8px 0 0}
  .submit{width:100%;min-height:80px;border:none;border-radius:18px;background:var(--ok);
    color:#fff;font-size:32px;font-weight:800;margin-top:6px}
  .submit:disabled{background:#b9b6ac}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
    align-items:center;justify-content:center;padding:16px;z-index:9}
  .overlay.on{display:flex}
  .modal{background:#fff;border-radius:20px;padding:22px;max-width:520px;width:100%;max-height:92vh;overflow:auto}
  .modal h2{margin:0 0 10px;font-size:28px}
  pre{white-space:pre-wrap;background:#f4f1ea;border-radius:12px;padding:14px;font:inherit;font-size:22px;margin:0 0 14px}
  .kakao{background:var(--kakao);color:#191919;border:none;border-radius:16px;min-height:72px;width:100%;font-size:28px;font-weight:800}
  .cancel{background:#fff;border:3px solid var(--line);border-radius:16px;min-height:60px;width:100%;font-size:24px;font-weight:700;margin-top:10px}
  .done{text-align:center;font-size:26px}
  .done .big{font-size:64px}
</style>
</head>
<body>
<div class="wrap">
  <h1>근무 상신</h1>
  <p class="hint">① 종류 → ② 날짜 → ③ 시간 → ④ 사유 → ⑤ 상신</p>

  <div class="card">
    <div class="step"><span class="num">1</span>종류</div>
    <div class="grid g2" id="types"></div>
  </div>

  <div class="card">
    <div class="step"><span class="num">2</span>날짜</div>
    <div class="grid g2">
      <button class="opt" id="dToday" aria-pressed="true">오늘</button>
      <button class="opt" id="dTomorrow" aria-pressed="false">내일</button>
    </div>
    <div class="lbl">다른 날짜</div>
    <input type="date" id="dateIn">
    <p class="hint" style="margin-top:10px" id="dateTxt"></p>
  </div>

  <div class="card">
    <div class="step"><span class="num">3</span>시간 <span style="font-size:18px;font-weight:400;color:var(--sub)">(08:00~16:00)</span></div>
    <div class="timebox">
      <button class="timebtn active" id="tbS"><small>시작</small><b id="tsS">--:--</b></button>
      <button class="timebtn" id="tbE"><small>종료</small><b id="tsE">--:--</b></button>
    </div>
    <div class="pick" id="pick">
      <div class="lbl" style="margin-top:0" id="pickLbl">시</div>
      <div class="grid g3" id="hours"></div>
      <div class="lbl">분</div>
      <div class="grid g3" id="mins"></div>
      <button class="submit" id="tOk" style="margin-top:16px" disabled>입력</button>
    </div>
    <p class="hint" id="autoNote" style="margin:10px 0 0"></p>
  </div>

  <div class="card">
    <div class="step"><span class="num">4</span>사유</div>
    <div class="grid g2" id="reasons"></div>
  </div>

  <div class="card">
    <div class="step"><span class="num">5</span>확인하고 상신</div>
    <dl class="summary" id="sum"></dl>
    <div class="err" id="err"></div>
    <button class="submit" id="go" disabled>상신</button>
  </div>
</div>

<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>

<script>
/* ===== 설정 (여기만 고치세요) ===== */
const CONFIG = {
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyTYXba0Kk9pnR2ZiISeLYvNeONRjrt65pC4kq3mxWqN6PtmR0OrFFznjHCSaEh2CNd/exec",   // 구글 Apps Script 웹앱 주소 (…/exec)
  SECRET: "leave7Kp2x9Qa",            // Apps Script 속성의 SECRET과 같은 값
  TYPES: ["지각","외출","조퇴","연가","반일연가"],   // 필요하면 이름 변경
  REASONS: ["개인사유","교회관련 사역"],
  DAY_START: 8*60, DAY_END: 16*60,       // 08:00 ~ 16:00
  MIN_STEP: 10                            // 분 단위 간격
};

const $ = s => document.querySelector(s);
const st = { date:new Date(), type:null, start:null, end:null, reason:null, editing:"S" };
const pad = n => String(n).padStart(2,"0");
const fmt = m => m==null ? "--:--" : pad(Math.floor(m/60))+":"+pad(m%60);
const DOW = ["일","월","화","수","목","금","토"];
const dateLabel = d => `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`;
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const safe = (k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){} };

/* 날짜 */
function setDate(d, which){
  st.date = d;
  $("#dToday").setAttribute("aria-pressed", which==="t");
  $("#dTomorrow").setAttribute("aria-pressed", which==="n");
  $("#dateIn").value = ymd(d);
  render();
}
$("#dToday").onclick = () => setDate(new Date(),"t");
$("#dTomorrow").onclick = () => { const d=new Date(); d.setDate(d.getDate()+1); setDate(d,"n"); };
$("#dateIn").onchange = e => { if(e.target.value){ const [y,m,d]=e.target.value.split("-").map(Number); setDate(new Date(y,m-1,d),"x"); } };
$("#dateIn").value = ymd(st.date);

/* 버튼 그룹 */
function buildChoice(box, items, key){
  items.forEach(t=>{
    const b=document.createElement("button");
    b.className="opt"; b.textContent=t; b.setAttribute("aria-pressed","false");
    b.onclick=()=>{ st[key]=t; [...box.children].forEach(c=>c.setAttribute("aria-pressed", c===b)); if(key==="type") onType(); render(); };
    box.appendChild(b);
  });
}
buildChoice($("#types"), CONFIG.TYPES, "type");
buildChoice($("#reasons"), CONFIG.REASONS, "reason");

/* 종류별 시간 규칙 */
function onType(){
  st.start=st.end=null;
  if(st.type==="연가"){ st.start=CONFIG.DAY_START; st.end=CONFIG.DAY_END; st.editing=null; }
  else if(st.type==="반일연가"){ st.start=12*60; st.end=CONFIG.DAY_END; st.editing=null; }
  else if(st.type==="조퇴"){ st.end=CONFIG.DAY_END; st.editing="S"; }
  else if(st.type==="지각"){ st.start=CONFIG.DAY_START; st.editing="E"; }
  else { st.editing="S"; }
}
const isAllDay = () => st.type==="연가" || st.type==="반일연가";
const startFixed = () => st.type==="지각";
const endFixed = () => st.type==="조퇴";

/* 시간 선택 (시 / 분 큰 버튼) */
$("#tbS").onclick = () => { if(!isAllDay() && !startFixed()){ st.editing="S"; render(); } };
$("#tbE").onclick = () => { if(!isAllDay() && !endFixed()){ st.editing="E"; render(); } };

$("#tOk").onclick = () => {
  if(curVal()==null) return;
  if(st.editing==="S" && !endFixed() && st.end==null){ st.editing="E"; render(); return; }
  st.editing=null; render();
  const nx=$("#reasons"); if(nx && nx.scrollIntoView) nx.scrollIntoView({behavior:"smooth",block:"center"});
};

function curVal(){ return st.editing==="S" ? st.start : st.end; }
function setVal(m){
  if(st.editing==="S") st.start=m; else st.end=m;
  // 시작을 고르면 종료 선택으로 자연스럽게 이동
}
function buildPicker(){
  const hours=$("#hours"), mins=$("#mins"); hours.innerHTML=""; mins.innerHTML="";
  const v=curVal(); const vh = v==null?null:Math.floor(v/60), vm = v==null?null:v%60;
  for(let h=CONFIG.DAY_START/60; h<=CONFIG.DAY_END/60; h++){
    const b=document.createElement("button"); b.className="opt"; b.textContent=pad(h)+"시";
    b.setAttribute("aria-pressed", vh===h);
    b.onclick=()=>{ const m = (h*60 + (vm??0)); setVal(clamp(h===16?960:m)); render(); };
    hours.appendChild(b);
  }
  for(let m=0;m<60;m+=CONFIG.MIN_STEP){
    const b=document.createElement("button"); b.className="opt"; b.textContent=pad(m)+"분";
    b.setAttribute("aria-pressed", vm===m && v!=null);
    const base=(vh??CONFIG.DAY_START/60)*60+m;
    b.disabled = base>CONFIG.DAY_END;
    b.onclick=()=>{ setVal(clamp(base)); if(st.editing==="S" && !endFixed() && st.end==null){ /* 안내만 */ } render(); };
    mins.appendChild(b);
  }
}
const clamp = m => Math.min(CONFIG.DAY_END, Math.max(CONFIG.DAY_START, m));

/* 검증 */
function problem(){
  if(!st.type) return "종류를 눌러주세요.";
  if(st.start==null) return "시작 시간을 골라주세요.";
  if(st.end==null) return "종료 시간을 골라주세요.";
  if(st.end<=st.start) return "종료 시간이 시작 시간보다 늦어야 합니다.";
  if(!st.reason) return "사유를 눌러주세요.";
  return "";
}
function durText(){
  const d=st.end-st.start, h=Math.floor(d/60), m=d%60;
  return (h?h+"시간":"")+(h&&m?" ":"")+(m?m+"분":"");
}
function message(){
  return [
    "[근무 상신]",
    `날짜: ${dateLabel(st.date)}`,
    `구분: ${st.type}`,
    `시간: ${fmt(st.start)} ~ ${fmt(st.end)} (${durText()})`,
    `사유: ${st.reason}`
  ].join("\n");
}

/* 화면 갱신 */
function render(){
  $("#dateTxt").textContent = "선택한 날짜: "+dateLabel(st.date);
  const sFixed=isAllDay()||startFixed(), eFixed=isAllDay()||endFixed();
  $("#tsS").textContent=fmt(st.start); $("#tsE").textContent=fmt(st.end);
  $("#tbS").className="timebtn"+(st.editing==="S"&&!sFixed?" active":"")+(sFixed?" fixed":"");
  $("#tbE").className="timebtn"+(st.editing==="E"&&!eFixed?" active":"")+(eFixed?" fixed":"");
  const picking = !!st.type && !isAllDay() && !!st.editing;
  $("#pick").style.display = picking ? "block":"none";
  $("#tbS small").textContent = sFixed ? "시작 (자동)" : (st.start==null ? "시작" : (st.editing==="S" ? "시작 입력 중" : "시작 ✔ 눌러서 수정"));
  $("#tbE small").textContent = eFixed ? "종료 (자동)" : (st.end==null ? "종료" : (st.editing==="E" ? "종료 입력 중" : "종료 ✔ 눌러서 수정"));
  $("#tOk").disabled = curVal()==null;
  $("#tOk").textContent = curVal()==null ? "시간을 골라주세요" : fmt(curVal())+" 입력";
  $("#pickLbl").textContent = (st.editing==="S"?"시작":"종료")+" 시간 — 시";
  $("#autoNote").textContent = isAllDay() ? (st.type==="연가" ? "연가는 하루 종일(08:00~16:00)로 자동 입력됩니다." : "반일연가는 12:00~16:00로 자동 입력됩니다.")
    : startFixed() ? "지각은 시작이 08:00으로 자동 입력됩니다. 출근한 시간(종료)만 고르세요."
    : endFixed() ? "조퇴는 종료 시간이 16:00으로 자동 입력됩니다."
    : !st.type ? "먼저 ①번에서 종류를 눌러주세요." : "";
  buildPicker();
  const p=problem();
  const ok=!p;
  $("#err").textContent = p;
  $("#go").disabled=!ok;
  $("#sum").innerHTML = ok ? `
    <dt>날짜</dt><dd>${dateLabel(st.date)}</dd>
    <dt>종류</dt><dd>${st.type}</dd>
    <dt>시간</dt><dd>${fmt(st.start)} ~ ${fmt(st.end)} (${durText()})</dd>
    <dt>사유</dt><dd>${st.reason}</dd>` : `<dd style="color:var(--sub);font-weight:400;font-size:20px">위 항목을 모두 고르면 여기에 요약이 보입니다.</dd>`;
}
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 상신 */
function openModal(html){ $("#modal").innerHTML=html; $("#ov").classList.add("on"); }
function closeModal(){ $("#ov").classList.remove("on"); }
let curId=null;

$("#go").onclick = () => {
  const msg=message();
  curId = Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  openModal(`
    <h2>이대로 상신할까요?</h2>
    <pre>${esc(msg)}</pre>
    <button class="kakao" id="send">상신 보내기</button>
    <button class="cancel" id="cc">돌아가서 고치기</button>`);
  $("#cc").onclick=closeModal;
  $("#send").onclick=()=>send(msg);
};

async function send(msg){
  const b=$("#send"); b.disabled=true; b.textContent="보내는 중...";
  if(!CONFIG.APPS_SCRIPT_URL){ // 서버 미설정: 복사로 대체
    try{ await navigator.clipboard.writeText(msg); }catch(e){}
    return done("서버가 아직 연결되지 않아<br>내용만 복사되었습니다.<br>카카오톡에 붙여넣기 하세요.");
  }
  const payload={ secret:CONFIG.SECRET, id:curId, text:msg, dateLabel:dateLabel(st.date)+" "+st.date.getFullYear(),
    type:st.type, start:fmt(st.start), end:fmt(st.end), reason:st.reason };
  try{
    await fetch(CONFIG.APPS_SCRIPT_URL,{ method:"POST", mode:"no-cors", keepalive:true,
      headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload) });
    done("상신되었습니다.<br>잠시 후 카카오톡에 도착합니다.", true);
  }catch(e){
    b.disabled=false; b.textContent="다시 보내기";
    $("#modal").insertAdjacentHTML("afterbegin",'<p class="err">전송에 실패했습니다. 인터넷을 확인하고 다시 눌러주세요.</p>');
  }
}
function done(t, reload){
  openModal(`<div class="done"><div class="big">✅</div><p>${t}</p>
    <button class="cancel" id="ok">닫기</button></div>`);
  $("#ok").onclick=()=>{ closeModal(); if(reload) location.reload(); };
}

render();
</script>
</body>
</html>
